name: ci

# Checks for every plugin in this repository (any folder that has Plugin.php).
# - check:        PHP syntax (php -l) on PHP 8.2 / 8.3, and config.json of each plugin
# - php-cs-fixer: same coding style as exceedone/exment
# - phpstan:      static analysis against Exment 7 (only NEW errors fail; see .github/ci/phpstan.neon)
# - exmentpm-script: ExmentPM's script.js is the build of resources/js/src/, and node --check reads all of it
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Same pinned version as exceedone/exment. When bumping, update both values.
env:
  PHP_CS_FIXER_VERSION: 3.94.2
  PHP_CS_FIXER_SHA256: aaafc3a53b877c6741ddccac0a783f0fb73fff5f84fba5870d5dd306ee22dde0

jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Exment SaaS runs PHP 8.2 and the market encodes plugins with the ionCube encoder for 8.2.
        php: ["8.2", "8.3"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none

      - name: PHP syntax (php -l)
        run: |
          php -v
          status=0
          while IFS= read -r -d '' f; do
            out=$(php -l "$f" 2>&1) || { echo "$out"; status=1; }
          done < <(find . -name '*.php' -not -path './.git/*' -not -path './.github/*' -print0)
          exit $status

      - name: config.json of each plugin
        run: php .github/ci/check-config.php

      # A plugin with several types: its Plugin.php (if any) is the page, so a site whose
      # plugins.plugin_types still lists one type does not fail on every request.
      - name: Plugin class on a one-type row (multi-type plugins)
        run: php groupware/tools/test-plugin-class.php

  php-cs-fixer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: none

      - name: Prepare
        run: |
          wget -q "https://github.com/PHP-CS-Fixer/PHP-CS-Fixer/releases/download/v${PHP_CS_FIXER_VERSION}/php-cs-fixer.phar" -O php-cs-fixer.phar
          echo "${PHP_CS_FIXER_SHA256}  php-cs-fixer.phar" | sha256sum -c -

      - name: Execute php-cs-fixer
        run: php php-cs-fixer.phar fix --dry-run -v --diff --config=.php-cs-fixer.dist.php

  phpstan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: .github/ci/vendor
          key: phpstan-vendor-${{ hashFiles('.github/ci/composer.json') }}-${{ github.run_id }}
          restore-keys: phpstan-vendor-${{ hashFiles('.github/ci/composer.json') }}-

      - name: Install Exment (for the analysis only)
        working-directory: .github/ci
        run: composer update --no-interaction --no-progress --prefer-dist --ignore-platform-req='ext-*'

      - name: Execute PHPStan
        working-directory: .github/ci
        run: |
          composer show exceedone/exment | grep -E '^versions'
          if [ -z "$(find ../.. -name '*.php' -not -path '../../.git/*' -not -path '../../.github/*' -not -name '*.blade.php' -print -quit)" ]; then
            echo "No plugin PHP files yet. Skip."
            exit 0
          fi
          php -d memory_limit=2G vendor/bin/phpstan analyse -c phpstan.neon --no-progress

      # The same check against the installed Exment: its base classes and the class name it
      # builds on a row with one type (PluginType::getPluginClassShortName).
      - name: Plugin class on a one-type row (with Exment)
        working-directory: .github/ci
        run: php ../../groupware/tools/test-plugin-class.php --exment

  exmentpm-script:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Builds in memory and compares with the committed file; node --check on
      # every source and on the result. Fix: node project-management/tools/build-pm-script.js
      - name: Build check (ExmentPM script.js)
        run: node project-management/tools/build-pm-script.js --check

      # The list after a refresh and after a save in the form (packed rows).
      - name: Refresh check (ExmentPM list rows)
        run: node project-management/tools/test-pm-refresh.js
      - name: ExmentPM web app service worker (offline page, assets, nothing else)
        run: node project-management/tools/test-pm-pwa.js
      - name: ExmentPM Web Push menu item (this device on and off, a shared browser)
        run: node project-management/tools/test-pm-push-menu.js

      - name: Screens made easier to use (ExmentPM UX)
        run: node project-management/tools/test-pm-ux.js

      - name: Markdown help of the editors (ExmentPM)
        run: node project-management/tools/test-pm-md.js

      # The custom attributes on the screen (ISS02939): the JSON a save sends,
      # how a value reads, the filters, the sort and the bulk edit.
      - name: Custom attributes check (ExmentPM screen)
        run: node project-management/tools/test-pm-attributes.js
      # The records of other tables an issue links to (ISS02939): the rows, safe links, the search.
      - name: Record links check (ExmentPM screen)
        run: node project-management/tools/test-pm-record-links.js
      - name: Simple or full issue screen (ExmentPM)
        run: node project-management/tools/test-pm-simple.js
      # Where each person's notice arrives (ISS02931): the chips, and the rule of the server.
      - name: Notice channels (ExmentPM)
        run: |
          node project-management/tools/test-pm-notify-to.js
          php project-management/tools/test-pm-notify-to.php
      - name: Command palette (ExmentPM)
        run: node project-management/tools/test-pm-palette.js
      - name: Issue actions in one menu (ExmentPM)
        run: node project-management/tools/test-pm-issue-actions.js
      # A request of the portal refused because the page expired (419): the bar with 再読み込み.
      - name: Expired page bar (ExmentPM)
        run: node project-management/tools/test-pm-expired.js

      - name: Recent updates pages (ExmentPM)
        run: php project-management/tools/test-pm-feed.php
      # Exment's messages for the next page (an expired form) drawn on the portal's screens.
      - name: Exment messages on the portal (ExmentPM)
        run: php project-management/tools/test-pm-flash.php

      # The custom attributes of a project's issues (ExmentPM, plain PHP)
      - name: Custom attributes check (ExmentPM server)
        run: php project-management/tools/test-pm-attributes.php
      - name: Every project in one gantt (ExmentPM)
        run: php project-management/tools/test-pm-all-gantt.php

      # The messages of the chat channels of a project (ExmentPM, plain PHP)
      - name: Chat channels (ExmentPM)
        run: php project-management/tools/test-pm-channels.php
      - name: ExmentPM Git link (webhook parsing, signatures, keys)
        run: php project-management/tools/test-pm-git.php
      - name: ExmentPM web app (manifest, worker settings, icons)
        run: php project-management/tools/test-pm-pwa.php
      # Web Push: RFC 8291 / 8292, the push services allowed, opt-in and out, removals (fake push service)
      - name: ExmentPM Web Push (encryption, VAPID, subscriptions)
        run: php project-management/tools/test-pm-push.php
      - name: ExmentPM Web Push upgrade (subscriptions encrypted at rest)
        run: php project-management/tools/test-pm-push-migrate.php
      - name: ExmentPM the bell's list (a notice, where a tap goes)
        run: php project-management/tools/test-pm-notices.php
      - name: Simple by default (ExmentPM schema 30)
        run: php project-management/tools/test-pm-features.php

      # The morning digest of each person (ExmentPM, plain PHP)
      - name: Morning digest (ExmentPM)
        run: php project-management/tools/test-pm-digest.php

      # Groupware's calendar (ISS02947): the occurrences and who sees what (plain PHP),
      # and the page's helpers - the days of a view, overlaps, repeats, UTC, busy items (JS).
      - name: Calendar check (Groupware)
        run: |
          php groupware/tools/test-gw-calendar.php
          node groupware/tools/test-gw-calendar.js

      # The calendar's ICS export and ICS links (part 5): the text written and read, the address
      # check, a fake client, a link read and exported again (plain PHP, no network).
      - name: Calendar ICS check (Groupware)
        run: php groupware/tools/test-gw-calendar-ics.php

      # Google and Microsoft calendars read only (part 6): the fixed hosts, the sign-in and its state,
      # the tokens encrypted and renewed, syncToken / deltaLink, 410, removals, busy or details, the caps
      # (plain PHP, a fake client: nothing is sent to Google or Microsoft).
      - name: Calendar Google and Microsoft check (Groupware)
        run: php groupware/tools/test-gw-calendar-cloud.php

      # The calendar's repeats against the walk from the start they replaced (a fixed seed, a few
      # thousand random rules), and a COUNT read as UNTIL.
      - name: Calendar repeats regression (Groupware)
        run: php groupware/tools/test-gw-calendar-rrule.php

      # Times in the time zone of the user: ExmentPM's clock, Groupware's mail dates.
      - name: User time zone check (scripts)
        run: node project-management/tools/test-user-timezone.js

      # Issues nested up to five levels: the tree, the progress under an issue,
      # and which issues may be a parent (PortalRules, plain PHP).
      - name: Issue levels check (ExmentPM)
        run: |
          node project-management/tools/test-issue-levels.js
          php project-management/tools/test-issue-levels.php

      # The Markdown of issue bodies, comments and wiki pages (ISS00245): what each rule
      # makes, and that nothing typed becomes markup.
      - name: Markdown check (ExmentPM)
        run: node project-management/tools/test-pm-markdown.js

      # The links to the manuals of ExmentPM, ExmentSupportDesk and ExmentGroupware.
      - name: Manual links check
        run: php project-management/tools/test-manual-links.php

      # how each person gets the notices: per event, projects muted, quiet hours (ExmentPM)
      - name: Notice settings (ExmentPM)
        run: php project-management/tools/test-pm-notify-prefs.php

      # links to files open outside the page loading of the admin screens
      - name: File links (ExmentPM, Groupware, Support Desk)
        run: php project-management/tools/check-file-links.php

      # The project routes without admin.morph still find a project the same way as the others.
      - name: Morph-less routes check (ExmentPM)
        run: php project-management/tools/test-pm-morph-routes.php

      # Every ja key is also in en (ExmentPM, Support Desk, Groupware): a key only in ja shows as
      # "undefined" in the other languages. An error: add the en text in the same PR.
      - name: Lang keys check (ja and en)
        run: php project-management/tools/test-lang-keys.php --ja-en

      # The names of ExmentSupportDesk: plugin_name, uri, uuid, feature keys, namespace, and no lang
      # value with the old product name (IT サポート / サポート窓口 / Help desk).
      - name: Plugin names (Support Desk)
        run: php support-desk/tools/test-plugin-name.php

      # Every locale has the keys and placeholders of ja (ExmentPM) or en (the others).
      # A warning only: a new ja key waits for its translations in a later PR.
      - name: Lang keys check (warning only)
        continue-on-error: true
        run: php project-management/tools/test-lang-keys.php

      # every route of ExmentPM has its method in the page class (a missing one is a 500)
      - name: Routes check (ExmentPM)
        run: php project-management/tools/test-pm-routes.php

      # The dates of the recurring schedules, RRULE and days off (ExmentPM, ISS00432)
      - name: Recurring schedule dates (ExmentPM)
        run: php project-management/tools/test-pm-rrule.php

      # The shares of the issues a schedule makes, the repair of the old ones, and the keys of
      # the copies (ExmentPM, plain PHP)
      - name: Schedule issue shares and keys (ExmentPM)
        run: php project-management/tools/test-pm-schedule-shares.php
      # whom a schedule's issues are made as, the batch first, a schedule that cannot run (ExmentPM)
      - name: Schedule owner and batch (ExmentPM)
        run: php project-management/tools/test-pm-schedule-owner.php

      # The holidays, the business days and the dates of the reminders (ExmentPM, ISS00432)
      - name: Business calendar and reminder dates (ExmentPM)
        run: |
          php project-management/tools/test-business-calendar.php
          php project-management/tools/test-pm-reminder.php

      # The messages of ExmentPMBacklog have no secret (plain PHP)
      - name: Messages check (ExmentPMBacklog)
        run: php project-management/tools/test-pmbl-secrets.php

      # Backlog's custom fields as ExmentPM's custom attributes (ExmentPMBacklog, plain PHP)
      - name: Backlog custom fields (ExmentPMBacklog)
        run: php project-management/tools/test-pmbl-attributes.php

      # The issues a run imports get the shares of their share settings, not one for whoever ran
      # it (ExmentPMBacklog with ExmentPM's PortalRunShares, plain PHP)
      - name: Shares of the imported issues (ExmentPMBacklog)
        run: php project-management/tools/test-pmbl-sync-shares.php

      # The alerts of Zabbix, Mackerel, Alertmanager and Azure Monitor, and
      # what they do to the tickets (ExmentSupportDesk, plain PHP).
      - name: Alert intake check (ExmentSupportDesk)
        run: php support-desk/tools/test-alert-intake.php

      # The steps of the SLA escalation (ExmentSupportDesk, plain PHP).
      - name: SLA escalation check (ExmentSupportDesk)
        run: php support-desk/tools/test-sla-escalation.php

      # The fields of the request catalog (ExmentSupportDesk, plain PHP).
      - name: Request catalog check (ExmentSupportDesk)
        run: php support-desk/tools/test-catalog-spec.php

      # The hosts of Mackerel and Zabbix into IT assets, and which asset a host is (plain PHP).
      - name: Asset sync check (ExmentSupportDesk)
        run: php support-desk/tools/test-asset-sync.php

      # the 受付箱 of the support desk: kinds, flows, progress (ISS02941)
      - name: Support desk boxes (Support Desk)
        run: php support-desk/tools/test-queue.php

      # what the support desk tells a chat, and Slack's marks kept as text (ISS02941)
      - name: Support desk chat notices (Support Desk)
        run: php support-desk/tools/test-chat-notices.php

      # the chat of the groupware: mentions, read counts, direct rooms, the polling (ISS02945)
      - name: Groupware chat (ExmentGroupware)
        run: php groupware/tools/test-chat-text.php

      # the tasks and the search of the chat
      - name: Groupware chat tasks (ExmentGroupware)
        run: php groupware/tools/test-chat-tasks.php

      # who the chat tells and how, and how long a room keeps its messages
      - name: Groupware chat notices (ExmentGroupware)
        run: php groupware/tools/test-chat-notify.php

      # calls from the chat: the servers of the setting, the length of a call (ISS02946)
      - name: Groupware chat calls (ExmentGroupware)
        run: php groupware/tools/test-chat-call.php

      # the web mail's OAuth client secrets in the plugin's settings: kept encrypted, never written
      # into the form, an empty field keeps them, the migration of a plain value (plain PHP, a fake
      # HTTP client: nothing is sent to Google or Microsoft)
      - name: Groupware mail client secrets (ExmentGroupware)
        run: php groupware/tools/test-gw-mail-secret.php

      # 「ExmentPM の課題にする」 and every route with its method (ISS02941)
      - name: Support desk ExmentPM link (Support Desk)
        run: php support-desk/tools/test-pm-link.php

      # the website form of a 受付箱 and the routes of the plugin (ISS02941)
      - name: Support desk website forms (Support Desk)
        run: php support-desk/tools/test-web-forms.php

      # the quote and the trial key of a ticket (ISS02941)
      - name: Support desk quotes and trial keys (Support Desk)
        run: php support-desk/tools/test-sales-link.php

      # the chat window of a box on a website: its key, the sites that may show it, the offline rule (ISS02941)
      - name: Support desk website chat (Support Desk)
        run: php support-desk/tools/test-guest-chat.php

      # calls with a customer by a link from a ticket (ISS02941)
      - name: Support desk calls with customers (Support Desk)
        run: php support-desk/tools/test-guest-call.php

      # The kintone REST API as the data sync reads it, with a fake kintone (ExmentKintone,
      # plain PHP)
      - name: kintone API check (ExmentKintone)
        run: php kintone/tools/test-kintone-api.php
