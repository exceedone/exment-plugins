name: ci

# Checks for every plugin in this repository (any folder that has Plugin.php).
# - check:        PHP syntax (php -l) on PHP 8.2 / 8.3, and config.json of each plugin
# - php-cs-fixer: same coding style as exceedone/exment
# - phpstan:      static analysis against Exment 7 (only NEW errors fail; see .github/ci/phpstan.neon)
# - exmentpm-script: ExmentPM's script.js is the build of resources/js/src/, and node --check reads all of it
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Same pinned version as exceedone/exment. When bumping, update both values.
env:
  PHP_CS_FIXER_VERSION: 3.94.2
  PHP_CS_FIXER_SHA256: aaafc3a53b877c6741ddccac0a783f0fb73fff5f84fba5870d5dd306ee22dde0

jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Exment SaaS runs PHP 8.2 and the market encodes plugins with the ionCube encoder for 8.2.
        php: ["8.2", "8.3"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none

      - name: PHP syntax (php -l)
        run: |
          php -v
          status=0
          while IFS= read -r -d '' f; do
            out=$(php -l "$f" 2>&1) || { echo "$out"; status=1; }
          done < <(find . -name '*.php' -not -path './.git/*' -not -path './.github/*' -print0)
          exit $status

      - name: config.json of each plugin
        run: php .github/ci/check-config.php

  php-cs-fixer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: none

      - name: Prepare
        run: |
          wget -q "https://github.com/PHP-CS-Fixer/PHP-CS-Fixer/releases/download/v${PHP_CS_FIXER_VERSION}/php-cs-fixer.phar" -O php-cs-fixer.phar
          echo "${PHP_CS_FIXER_SHA256}  php-cs-fixer.phar" | sha256sum -c -

      - name: Execute php-cs-fixer
        run: php php-cs-fixer.phar fix --dry-run -v --diff --config=.php-cs-fixer.dist.php

  phpstan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: .github/ci/vendor
          key: phpstan-vendor-${{ hashFiles('.github/ci/composer.json') }}-${{ github.run_id }}
          restore-keys: phpstan-vendor-${{ hashFiles('.github/ci/composer.json') }}-

      - name: Install Exment (for the analysis only)
        working-directory: .github/ci
        run: composer update --no-interaction --no-progress --prefer-dist --ignore-platform-req='ext-*'

      - name: Execute PHPStan
        working-directory: .github/ci
        run: |
          composer show exceedone/exment | grep -E '^versions'
          if [ -z "$(find ../.. -name '*.php' -not -path '../../.git/*' -not -path '../../.github/*' -not -name '*.blade.php' -print -quit)" ]; then
            echo "No plugin PHP files yet. Skip."
            exit 0
          fi
          php -d memory_limit=2G vendor/bin/phpstan analyse -c phpstan.neon --no-progress

  exmentpm-script:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Builds in memory and compares with the committed file; node --check on
      # every source and on the result. Fix: node project-management/tools/build-pm-script.js
      - name: Build check (ExmentPM script.js)
        run: node project-management/tools/build-pm-script.js --check

      # The list after a refresh and after a save in the form (packed rows).
      - name: Refresh check (ExmentPM list rows)
        run: node project-management/tools/test-pm-refresh.js

      - name: Screens made easier to use (ExmentPM UX)
        run: node project-management/tools/test-pm-ux.js

      # The custom attributes on the screen (ISS02939): the JSON a save sends,
      # how a value reads, the filters, the sort and the bulk edit.
      - name: Custom attributes check (ExmentPM screen)
        run: node project-management/tools/test-pm-attributes.js
      - name: Simple or full issue screen (ExmentPM)
        run: node project-management/tools/test-pm-simple.js
      # Where each person's notice arrives (ISS02931): the chips, and the rule of the server.
      - name: Notice channels (ExmentPM)
        run: |
          node project-management/tools/test-pm-notify-to.js
          php project-management/tools/test-pm-notify-to.php
      - name: Command palette (ExmentPM)
        run: node project-management/tools/test-pm-palette.js
      - name: Issue actions in one menu (ExmentPM)
        run: node project-management/tools/test-pm-issue-actions.js

      - name: Recent updates pages (ExmentPM)
        run: php project-management/tools/test-pm-feed.php

      # The custom attributes of a project's issues (ExmentPM, plain PHP)
      - name: Custom attributes check (ExmentPM server)
        run: php project-management/tools/test-pm-attributes.php
      # The messages of the chat channels of a project (ExmentPM, plain PHP)
      - name: Chat channels (ExmentPM)
        run: php project-management/tools/test-pm-channels.php
      - name: Simple by default (ExmentPM schema 30)
        run: php project-management/tools/test-pm-features.php

      # Times in the time zone of the user: ExmentPM's clock, Groupware's mail dates.
      - name: User time zone check (scripts)
        run: node project-management/tools/test-user-timezone.js

      # Issues nested up to five levels: the tree, the progress under an issue,
      # and which issues may be a parent (PortalRules, plain PHP).
      - name: Issue levels check (ExmentPM)
        run: |
          node project-management/tools/test-issue-levels.js
          php project-management/tools/test-issue-levels.php

      # The Markdown of issue bodies, comments and wiki pages (ISS00245): what each rule
      # makes, and that nothing typed becomes markup.
      - name: Markdown check (ExmentPM)
        run: node project-management/tools/test-pm-markdown.js

      # The links to the manuals of ExmentPM, ExmentITSupport and ExmentGroupware.
      - name: Manual links check
        run: php project-management/tools/test-manual-links.php

      # how each person gets the notices: per event, projects muted, quiet hours (ExmentPM)
      - name: Notice settings (ExmentPM)
        run: php project-management/tools/test-pm-notify-prefs.php

      # The project routes without admin.morph still find a project the same way as the others.
      - name: Morph-less routes check (ExmentPM)
        run: php project-management/tools/test-pm-morph-routes.php

      # Every locale has the keys and placeholders of ja (ExmentPM) or en (the others).
      # A warning only: a new ja key waits for its translations in a later PR.
      - name: Lang keys check (warning only)
        continue-on-error: true
        run: php project-management/tools/test-lang-keys.php

      # every route of ExmentPM has its method in the page class (a missing one is a 500)
      - name: Routes check (ExmentPM)
        run: php project-management/tools/test-pm-routes.php

      # The dates of the recurring schedules, RRULE and days off (ExmentPM, ISS00432)
      - name: Recurring schedule dates (ExmentPM)
        run: php project-management/tools/test-pm-rrule.php

      # The holidays, the business days and the dates of the reminders (ExmentPM, ISS00432)
      - name: Business calendar and reminder dates (ExmentPM)
        run: |
          php project-management/tools/test-business-calendar.php
          php project-management/tools/test-pm-reminder.php

      # The messages of ExmentPMBacklog have no secret (plain PHP)
      - name: Messages check (ExmentPMBacklog)
        run: php project-management/tools/test-pmbl-secrets.php

      # Backlog's custom fields as ExmentPM's custom attributes (ExmentPMBacklog, plain PHP)
      - name: Backlog custom fields (ExmentPMBacklog)
        run: php project-management/tools/test-pmbl-attributes.php

      # The alerts of Zabbix, Mackerel, Alertmanager and Azure Monitor, and
      # what they do to the tickets (ExmentITSupport, plain PHP).
      - name: Alert intake check (ExmentITSupport)
        run: php it-support/tools/test-alert-intake.php

      # The steps of the SLA escalation (ExmentITSupport, plain PHP).
      - name: SLA escalation check (ExmentITSupport)
        run: php it-support/tools/test-sla-escalation.php

      # The fields of the request catalog (ExmentITSupport, plain PHP).
      - name: Request catalog check (ExmentITSupport)
        run: php it-support/tools/test-catalog-spec.php

      # The hosts of Mackerel and Zabbix into IT assets, and which asset a host is (plain PHP).
      - name: Asset sync check (ExmentITSupport)
        run: php it-support/tools/test-asset-sync.php

      # The kintone REST API as the data sync reads it, with a fake kintone (ExmentKintone,
      # plain PHP)
      - name: kintone API check (ExmentKintone)
        run: php kintone/tools/test-kintone-api.php
