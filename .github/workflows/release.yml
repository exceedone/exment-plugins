name: release

# Builds the zip people upload to Exment and attaches it to a GitHub release.
#
# Push a tag named <PluginFolder>-v<version>, for example:
#   git tag ExmentPM-v1.4.0 && git push origin ExmentPM-v1.4.0
# The version must equal "version" in that plugin's config.json.
#
# Why a built zip: Exment reads config.json at the top of the zip, and
# ExmentPM also has templates/pm_portal/config.json. The plugin market reads
# the last config.json it finds, so the top one has to be written last. Few
# people get that right by hand; the workflow always does.
on:
  push:
    tags: ['*-v*']
  # again for a tag that is there (this file of main, the files of the tag):
  # Actions -> release -> Run workflow -> the tag, e.g. ExmentITSupport-v1.0.6
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag, e.g. ExmentITSupport-v1.0.6'
        required: true

permissions:
  contents: write

# The free official plugins (ExmentPM, ExmentITSupport, ExmentGroupware) also go,
# as the same zip and its release record NOT signed, into a pull request to
# exceedone/exment-plugins-release (Exment bundles them, ISS00419). The key is
# only on the computer of the person who signs; that pull request is signed there
# (php tools/release.php sign ...) and merged. Exment uses only signed releases.
# A fix for safety: put "security: <one line>" in the message of an annotated tag
#   git tag -a ExmentITSupport-v1.0.6 -m "security: <note>"
# Needs the secret OFFICIAL_PLUGINS_TOKEN (a fine-grained token: contents and pull
# requests of exment-plugins-release only). Variables (optional):
# EXMENT_REQUIRES_<PLUGIN NAME IN CAPITALS>, e.g. EXMENT_REQUIRES_EXMENTITSUPPORT = ">=7.2.0 <7.4"

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      # the tag pushed, or the one given to "Run workflow"
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # the files of the tag (also when this is run again from main)
          ref: refs/tags/${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Find the plugin
        id: plugin
        run: |
          tag="${TAG}"
          name="${tag%-v*}"
          version="${tag##*-v}"
          dir=$(find . -mindepth 2 -maxdepth 2 -type d -name "$name" -not -path './.git/*' | head -1)
          if [ -z "$dir" ] || [ ! -f "$dir/config.json" ]; then
            echo "::error::No plugin folder named $name with a config.json"; exit 1
          fi
          declared=$(jq -r .version "$dir/config.json")
          if [ "$declared" != "$version" ]; then
            echo "::error::Tag says $version but $dir/config.json says $declared"; exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Build the zip
        run: |
          out="$GITHUB_WORKSPACE/${{ steps.plugin.outputs.name }}-${{ steps.plugin.outputs.version }}.zip"
          cd "${{ steps.plugin.outputs.dir }}"
          # everything but the top config.json, then the top config.json last
          zip -r -X "$out" . -x config.json
          zip -X "$out" config.json
          unzip -l "$out" | tail -n 4

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="${{ steps.plugin.outputs.name }}"
          version="${{ steps.plugin.outputs.version }}"
          zip="$name-$version.zip"
          {
            echo "Upload \`$zip\` in Exment: **Admin settings → Plugins → Plugin upload**. After updating, open the portal and press **⚙ Settings → Update data structure** if it asks."
            echo
            echo "Exment の **管理者設定 → プラグイン → プラグインアップロード** で \`$zip\` を選びます。更新のときは、そのあとポータルの **⚙ 設定 → データ構造の更新** を押します（表示されたとき）。"
          } > notes.md
          # run again: the release is there already. Its zip is the one people have:
          # the same bytes go to exment-plugins-release (the sha256 of its record)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "The release $TAG is there already: its zip is used"
            gh release download "$TAG" -p "$zip" --clobber
            exit 0
          fi
          gh release create "$TAG" "$zip" --title "$name $version" --notes-file notes.md

      - name: An official plugin (bundled with Exment)
        id: official
        run: |
          case "${{ steps.plugin.outputs.name }}" in
            ExmentPM|ExmentITSupport|ExmentGroupware) echo "yes=1" >> "$GITHUB_OUTPUT" ;;
            *) echo "yes=" >> "$GITHUB_OUTPUT" ;;
          esac
          # "security: <note>" in the message of the tag
          note="$(git tag -l --format='%(contents)' "$TAG" | sed -n 's/^security: *//p' | head -1)"
          echo "note=$note" >> "$GITHUB_OUTPUT"
          echo "var=EXMENT_REQUIRES_$(echo '${{ steps.plugin.outputs.name }}' | tr 'a-z' 'A-Z')" >> "$GITHUB_OUTPUT"

      - uses: shivammathur/setup-php@v2
        if: steps.official.outputs.yes == '1'
        with:
          php-version: '8.2'
          extensions: sodium, zip

      - name: Its release (not signed) into a pull request to exment-plugins-release
        if: steps.official.outputs.yes == '1'
        env:
          GH_TOKEN: ${{ secrets.OFFICIAL_PLUGINS_TOKEN }}
          NOTE: ${{ steps.official.outputs.note }}
          REQUIRES: ${{ vars[steps.official.outputs.var] }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::warning::No OFFICIAL_PLUGINS_TOKEN: the release is not put into exment-plugins-release"; exit 0; fi
          name="${{ steps.plugin.outputs.name }}"
          version="${{ steps.plugin.outputs.version }}"
          base="$name-$version"
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/exceedone/exment-plugins-release.git" official
          # the first safe version carries over from the version before (ISS00421 "5")
          # (the first release of a plugin has none before it)
          prev="$(ls official/releases/$name-*.json 2>/dev/null | head -1)"
          min=""
          if [ -n "$prev" ] && [ -f "$prev" ]; then
            min="$(php -r '$r = json_decode((string) file_get_contents($argv[1]), true); echo is_array($r) ? ($r["security_min"] ?? "") : "";' "$prev")"
          fi
          set -- "$base.zip" "$base.json" "${REQUIRES:->=7.2.0 <7.4}" ">=8.2"
          if [ -n "$NOTE" ]; then set -- "$@" --security "$NOTE"; elif [ -n "$min" ]; then set -- "$@" --security-min "$min"; fi
          php official/tools/release.php make "$@"
          cd official
          branch="release/$base"
          git checkout -q -b "$branch"
          # only the newest version of each plugin stays (the sites keep what they installed)
          rm -f releases/$name-*.zip releases/$name-*.json
          cp "../$base.zip" "../$base.json" releases/
          git add -A releases
          git -c user.name="exment-release" -c user.email="exment-release@users.noreply.github.com" commit -q -m "release: $base (not signed)"
          # run again: the branch and the pull request may be there already
          git push -q -f origin "$branch"
          if gh pr view "$branch" --repo exceedone/exment-plugins-release >/dev/null 2>&1; then echo "The pull request is there already (pushed again)"; exit 0; fi
          gh pr create --repo exceedone/exment-plugins-release --base main --head "$branch"             --title "release: $base"             --body "Built by the release of exment-plugins ($TAG). **Not signed yet**: sign it on the computer with the key (\`php tools/release.php sign releases/$base.json <key-folder>/release-2026-1.key\`), push, then merge."
